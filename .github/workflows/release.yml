# Publishes a release: `git tag v0.1.0 && git push origin v0.1.0`.
# Builds `pixel` for each platform and uploads the .tar.gz archives with their SHA-256 to the GitHub Release.
# The plugin launcher (claude-plugin/pixel-studio/bin/pixel-mcp) downloads from here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml, plugin.json and the launcher
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          plugin_v="$(grep -m1 '"version"' claude-plugin/pixel-studio/.claude-plugin/plugin.json | cut -d'"' -f4)"
          launcher_v="$(grep -m1 '^VERSION=' claude-plugin/pixel-studio/bin/pixel-mcp | cut -d'"' -f2)"
          echo "tag=$tag cargo=$cargo_v plugin=$plugin_v launcher=$launcher_v"
          test "$tag" = "$cargo_v" && test "$tag" = "$plugin_v" && test "$tag" = "$launcher_v"

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, tool: cargo }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, tool: cross }
          - { target: x86_64-apple-darwin, os: macos-latest, tool: cargo }
          - { target: aarch64-apple-darwin, os: macos-latest, tool: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cross
        if: matrix.tool == 'cross'
        run: cargo install cross --locked
      - name: Build
        run: ${{ matrix.tool }} build --release --locked -p pixel --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          asset="pixel-$v-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" pixel
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.sha256
          generate_release_notes: true
