<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
  /* Layout: header with name and dimensions; canvas stage and inspector panel side by side;
     timeline below. Under 860px everything stacks into one column. */
  :root {
    --bg: #f2f3f6;
    --surface: #ffffff;
    --fg: #1b1f2a;
    --muted: #5b6273;
    --line: #d8dbe4;
    --accent: #2f4fd8;
    --accent-fg: #ffffff;
    --check-a: #e8eaf0;
    --check-b: #d6d9e2;
    --font-display: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141b; --surface: #1a1d27; --fg: #e6e8ef; --muted: #9aa1b4; --line: #2c3142;
      --accent: #8fa2ff; --accent-fg: #0d1020; --check-a: #252a38; --check-b: #1c1f2b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141b; --surface: #1a1d27; --fg: #e6e8ef; --muted: #9aa1b4; --line: #2c3142;
    --accent: #8fa2ff; --accent-fg: #0d1020; --check-a: #252a38; --check-b: #1c1f2b;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  .wrap {
    max-width: 1280px; margin: 0 auto; display: grid; gap: 16px;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: 0.02em; text-wrap: balance; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip { border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
  .viewer { display: grid; gap: 8px; min-width: 0; }
  .stage {
    display: flex; overflow: auto; height: min(68vh, 720px); min-height: 200px;
    border: 1px solid var(--line); border-radius: 6px;
    background-color: var(--check-a);
    background-image: conic-gradient(var(--check-b) 25%, transparent 0 50%, var(--check-b) 0 75%, transparent 0);
    background-size: 16px 16px;
  }
  .stage canvas { margin: auto; flex: none; display: block; image-rendering: crisp-edges; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .bar .spacer { flex: 1; }
  button {
    font: 500 13px var(--font-body); color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .zoom { font-family: var(--font-data); font-size: 12px; color: var(--muted); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }
  .panel { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
  .panel h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .inspect { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
  .swatch-big {
    width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--line);
    background-color: var(--check-a);
    background-image: conic-gradient(var(--check-b) 25%, transparent 0 50%, var(--check-b) 0 75%, transparent 0);
    background-size: 10px 10px; position: relative; overflow: hidden;
  }
  .swatch-big span { position: absolute; inset: 0; }
  .mono { font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .layers { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .layers label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .layers .op { margin-left: auto; color: var(--muted); }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(22px, 1fr)); gap: 4px; }
  .palette button { aspect-ratio: 1; padding: 0; border-radius: 3px; min-width: 0; max-width: 100%; }
  .timeline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
  .timeline input { flex: 1 1 180px; accent-color: var(--accent); min-width: 0; }
  .save { display: grid; gap: 8px; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .save img { image-rendering: pixelated; max-width: 100%; height: auto; border: 1px solid var(--line); }
  footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .toast { color: var(--accent); font-size: 12px; min-height: 1.5em; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header>
    <h1 id="name">__PIXEL_TITLE__</h1>
    <div class="chips" id="chips"></div>
  </header>

  <div class="main">
    <section class="viewer" aria-label="Canvas">
      <div class="bar">
        <button id="fit" type="button">Fit</button>
        <button id="out" type="button" aria-label="Zoom out">−</button>
        <span class="zoom" id="zoom">×1</span>
        <button id="in" type="button" aria-label="Zoom in">+</button>
        <span class="spacer"></span>
        <button id="savebtn" type="button">Image to save</button>
      </div>
      <div class="stage" id="stage"><canvas id="cv" aria-label="Pixel art canvas"></canvas></div>
      <div class="timeline" id="timeline" hidden>
        <button id="play" type="button" class="primary">Play</button>
        <input id="scrub" type="range" min="0" max="0" value="0" aria-label="History step">
        <span class="mono" id="step"></span>
      </div>
      <div class="save" id="save" hidden>
        <p class="hint" id="savehint"></p>
        <img id="saveimg" alt="Upscaled canvas image">
      </div>
    </section>

    <aside class="panel">
      <div>
        <h2>Inspector</h2>
        <div class="inspect">
          <div class="swatch-big"><span id="sw"></span></div>
          <div>
            <div class="mono" id="pos">—</div>
            <div class="mono" id="hex">Hover over the canvas</div>
          </div>
        </div>
      </div>
      <div id="layerbox" hidden>
        <h2>Layers</h2>
        <ul class="layers" id="layers"></ul>
        <p class="hint" id="layerhint" hidden>Layers show the final state.</p>
      </div>
      <div>
        <h2>Palette</h2>
        <div class="palette" id="palette"></div>
        <div class="toast" id="toast" aria-live="polite"></div>
      </div>
    </aside>
  </div>

  <footer>
    <span id="made"></span>
    <span>Made with pixelcode, a pixel-perfect drawing engine</span>
  </footer>
</div>

<script type="application/json" id="pixel-data">__PIXEL_DATA__</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("pixel-data").textContent);
  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d", { willReadFrequently: true });
  const stage = $("stage");
  const ZOOMS = [0.125, 0.25, 0.5, 1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64];
  let zoom = 1, frame = 0, playing = null, images = [], layerImgs = [];
  const visible = data.layers.map((l) => l.visible);
  const opacity = data.layers.map((l) => l.opacity);
  const BLEND = { over: "source-over", multiply: "multiply", screen: "screen", add: "lighter", darken: "darken", lighten: "lighten", erase: "destination-out", replace: "copy" };

  const load = (b64) => new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = fail;
    img.src = "data:image/png;base64," + b64;
  });
  const hex2 = (v) => v.toString(16).padStart(2, "0");
  const fmt = (n) => n.toLocaleString();

  function chips() {
    const parts = [data.width + "×" + data.height + " px"];
    if (data.layers.length > 1) parts.push(data.layers.length + " layers");
    if (data.frames.length > 1) parts.push(data.steps + " steps");
    if (data.scale > 1) parts.push("shown at 1/" + data.scale);
    $("chips").replaceChildren(...parts.map((t) => Object.assign(document.createElement("span"), { className: "chip", textContent: t })));
    const d = new Date(data.created);
    $("made").textContent = isNaN(d) ? "" : "Exported " + d.toLocaleString();
  }

  function layersDefault() {
    return data.layers.every((l, i) => visible[i] === l.visible && opacity[i] === l.opacity);
  }

  function render() {
    const last = images.length - 1;
    ctx.imageSmoothingEnabled = false;
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (frame === last && !layersDefault() && layerImgs.length) {
      layerImgs.forEach((img, i) => {
        if (!visible[i] || opacity[i] <= 0) return;
        ctx.globalAlpha = opacity[i];
        ctx.globalCompositeOperation = BLEND[data.layers[i].blend] || "source-over";
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
      });
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    } else {
      ctx.drawImage(images[frame], 0, 0, cv.width, cv.height);
    }
    $("layerhint").hidden = frame === last;
    document.querySelectorAll("#layers input").forEach((el) => { el.disabled = frame !== last; });
    if (images.length > 1) {
      $("scrub").value = String(frame);
      const label = (data.labels || [])[frame];
      $("step").textContent = "step " + (frame + 1) + " of " + images.length + (label ? " · " + label : "");
    }
  }

  function setZoom(z) {
    zoom = z;
    cv.style.width = cv.width * z + "px";
    cv.style.height = cv.height * z + "px";
    $("zoom").textContent = z >= 1 ? "×" + z : "×1/" + Math.round(1 / z);
  }

  // Picks the largest zoom that fits and sizes the stage to the image.
  function fit() {
    const maxH = Math.min(window.innerHeight * 0.68, 720);
    const sw = stage.clientWidth - 16;
    const f = Math.min(sw / cv.width, (maxH - 16) / cv.height);
    let z = ZOOMS[0];
    for (const v of ZOOMS) if (v <= f) z = v;
    setZoom(z);
    stage.style.height = Math.max(200, Math.min(maxH, cv.height * z + 32)) + "px";
  }

  function step(dir) {
    const i = ZOOMS.indexOf(zoom);
    const next = ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, (i < 0 ? 3 : i) + dir))];
    setZoom(next);
  }

  function inspect(ev) {
    const r = cv.getBoundingClientRect();
    const px = Math.floor(((ev.clientX - r.left) / r.width) * cv.width);
    const py = Math.floor(((ev.clientY - r.top) / r.height) * cv.height);
    if (px < 0 || py < 0 || px >= cv.width || py >= cv.height) return;
    const [R, G, B, A] = ctx.getImageData(px, py, 1, 1).data;
    const x = Math.floor((px * data.width) / cv.width), y = Math.floor((py * data.height) / cv.height);
    $("pos").textContent = "x " + x + "  y " + y;
    if (A === 0) {
      $("hex").textContent = "transparent";
      $("sw").style.background = "transparent";
    } else {
      const hex = "#" + hex2(R) + hex2(G) + hex2(B) + (A < 255 ? hex2(A) : "");
      $("hex").textContent = hex + (A < 255 ? "  alpha " + A : "");
      $("sw").style.background = "rgba(" + R + "," + G + "," + B + "," + A / 255 + ")";
    }
  }

  function toast(text) {
    $("toast").textContent = text;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { $("toast").textContent = ""; }, 1800);
  }

  function palette(img) {
    const max = 512;
    const s = Math.max(1, Math.ceil(Math.max(img.width, img.height) / max));
    const w = Math.ceil(img.width / s), h = Math.ceil(img.height / s);
    const off = document.createElement("canvas");
    off.width = w; off.height = h;
    const o = off.getContext("2d", { willReadFrequently: true });
    o.imageSmoothingEnabled = false;
    o.drawImage(img, 0, 0, w, h);
    const px = o.getImageData(0, 0, w, h).data;
    const counts = new Map();
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] === 0) continue;
      const k = "#" + hex2(px[i]) + hex2(px[i + 1]) + hex2(px[i + 2]) + (px[i + 3] < 255 ? hex2(px[i + 3]) : "");
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    const top = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 48);
    const box = $("palette");
    box.replaceChildren(...top.map(([hex, n]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.style.background = hex;
      b.title = hex + " · " + fmt(n * s * s) + " px";
      b.setAttribute("aria-label", "Copy " + hex);
      b.addEventListener("click", () => {
        const done = () => toast(hex + " copied");
        try {
          navigator.clipboard.writeText(hex).then(done, () => toast(hex));
        } catch (e) {
          toast(hex);
        }
      });
      return b;
    }));
    const more = counts.size - top.length;
    if (more > 0) $("toast").textContent = "+" + fmt(more) + " more colors";
  }

  function buildLayers() {
    if (data.layers.length < 2) return;
    $("layerbox").hidden = false;
    $("layers").replaceChildren(...data.layers.map((l, i) => {
      const li = document.createElement("li");
      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.id = "layer-" + i;
      box.checked = l.visible;
      box.addEventListener("change", () => { visible[i] = box.checked; render(); });
      const name = document.createElement("span");
      name.textContent = l.name;
      const op = document.createElement("span");
      op.className = "op mono";
      op.textContent = l.empty ? "empty" : Math.round(l.opacity * 100) + "%" + (l.blend !== "over" ? " · " + l.blend : "");
      label.append(box, name, op);
      li.append(label);
      return li;
    }));
  }

  function play() {
    if (playing) {
      clearInterval(playing);
      playing = null;
      $("play").textContent = "Play";
      return;
    }
    if (frame >= images.length - 1) frame = 0;
    $("play").textContent = "Pause";
    playing = setInterval(() => {
      if (frame >= images.length - 1) { play(); return; }
      frame += 1;
      render();
    }, Math.max(60, Math.min(400, 6000 / images.length)));
  }

  function saveView() {
    const box = $("save");
    if (!box.hidden) { box.hidden = true; return; }
    const k = Math.max(1, Math.floor(1024 / Math.max(cv.width, cv.height)));
    const off = document.createElement("canvas");
    off.width = cv.width * k; off.height = cv.height * k;
    const o = off.getContext("2d");
    o.imageSmoothingEnabled = false;
    o.drawImage(cv, 0, 0, off.width, off.height);
    $("saveimg").src = off.toDataURL("image/png");
    $("savehint").textContent = "PNG ×" + k + " (" + off.width + "×" + off.height + " px). Right-click or long-press the image and choose Save image.";
    box.hidden = false;
  }

  async function start() {
    chips();
    images = await Promise.all(data.frames.map(load));
    layerImgs = data.layers.length > 1 ? await Promise.all(data.layers.map((l) => load(l.png))) : [];
    const final = images[images.length - 1];
    cv.width = final.width;
    cv.height = final.height;
    frame = images.length - 1;
    if (images.length > 1) {
      $("timeline").hidden = false;
      $("scrub").max = String(images.length - 1);
    }
    buildLayers();
    render();
    fit();
    palette(final);
    $("fit").addEventListener("click", fit);
    $("in").addEventListener("click", () => step(1));
    $("out").addEventListener("click", () => step(-1));
    $("play").addEventListener("click", play);
    $("scrub").addEventListener("input", (e) => { frame = Number(e.target.value); render(); });
    $("savebtn").addEventListener("click", saveView);
    cv.addEventListener("pointermove", inspect);
    cv.addEventListener("pointerdown", inspect);
    window.addEventListener("resize", () => { if (zoom <= 1) fit(); });
  }

  start().catch((e) => {
    $("hex").textContent = "Could not load the image: " + e;
  });
})();
</script>
